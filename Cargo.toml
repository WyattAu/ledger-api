[package]
name = "ledger-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP API over the WyattAu accounting estate — ledger, reconciliation, reports, tax, all from the released crates"
license = "AGPL-3.0"
repository = "https://github.com/WyattAu/ledger-api"
keywords = ["accounting", "api", "ledger", "axum", "finance"]
categories = ["finance", "api-bindings"]

[dependencies]
double-entry = "=0.1.1"
ledger-pg = "=0.2.2"
report-kit = "=0.2.3"
vat-return = "=0.1.10"
vat-mtd = "=0.1.6"
recon-kit = "=0.2.0"
sales-tax = "=0.1.0"
vat-rules = "=0.1.1"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
